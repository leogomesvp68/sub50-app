<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub 50 Cinquenta - Estatisticas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 min-h-screen">
<div id="root" class="p-4"></div>
<script>
var firebaseConfig = {
    apiKey: "AIzaSyDIxb37IhllYt8R6_iRcxy1e4KlZupFXb4",
    authDomain: "sub50-253ae.firebaseapp.com",
    projectId: "sub50-253ae",
    storageBucket: "sub50-253ae.firebasestorage.app",
    messagingSenderId: "874737275056",
    appId: "1:874737275056:web:f35150e408b63f06326b75"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var ADMIN_PASSWORD = "subcinquenta123";
var players = [];
var matches = [];
var activeTab = 'rankings';
var newPlayerNameValue = '';
var currentMatch = { date: '', stats: {}, attendance: {}, results: {} };
var editingMatchId = null;
var isAdmin = sessionStorage.getItem('sub50_admin') === 'true';
var showPasswordModal = false;
var passwordInputValue = '';
var loading = true;

function loadData() {
    loading = true;
    render();
    Promise.all([
        db.collection('players').orderBy('name').get(),
        db.collection('matches').orderBy('date').get()
    ]).then(function(results) {
        players = results[0].docs.map(function(d) { var o = d.data(); o.id = d.id; return o; });
        matches = results[1].docs.map(function(d) { var o = d.data(); o.id = d.id; return o; });
        loading = false;
        render();
    }).catch(function(e) { console.error(e); loading = false; render(); });
}

function setTab(tab) { activeTab = tab; render(); }
function openAdminModal() { showPasswordModal = true; render(); }
function closeAdminModal() { showPasswordModal = false; passwordInputValue = ''; render(); }

function checkPassword() {
    if (passwordInputValue === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('sub50_admin', 'true');
        showPasswordModal = false;
        passwordInputValue = '';
        render();
        alert('Login realizado com sucesso!');
    } else {
        alert('Senha incorreta!');
        passwordInputValue = '';
        render();
    }
}

function logout() {
    isAdmin = false;
    sessionStorage.removeItem('sub50_admin');
    activeTab = 'rankings';
    render();
}

function addPlayer() {
    if (!isAdmin) { alert('Apenas administradores podem adicionar jogadores!'); return; }
    var name = newPlayerNameValue.trim();
    if (name) {
        db.collection('players').add({
            name: name, totalGoals: 0, totalAssists: 0,
            totalPresence: 0, totalPoints: 0, wins: 0, draws: 0, losses: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() { newPlayerNameValue = ''; loadData(); })
        .catch(function(e) { console.error(e); alert('Erro ao adicionar jogador!'); });
    }
}

function removePlayer(id) {
    if (!isAdmin) { alert('Apenas administradores podem remover jogadores!'); return; }
    if (confirm('Tem certeza que deseja remover este jogador?')) {
        db.collection('players').doc(id).delete()
        .then(function() { loadData(); })
        .catch(function(e) { console.error(e); alert('Erro ao remover jogador!'); });
    }
}

function onStatInput(playerId, stat, value) {
    var n = Math.max(0, parseInt(value) || 0);
    if (!currentMatch.stats[playerId]) currentMatch.stats[playerId] = { goals: 0, assists: 0 };
    currentMatch.stats[playerId][stat] = n;
}

function toggleAttendance(playerId) {
    currentMatch.attendance[playerId] = !currentMatch.attendance[playerId];
    renderTabContent();
}

function setResult(playerId, result) {
    currentMatch.results[playerId] = result;
    renderTabContent();
}

function cancelEdit() {
    currentMatch = { date: '', stats: {}, attendance: {}, results: {} };
    editingMatchId = null;
    render();
}

function recalcTotals(matchesList, callback) {
    var i = 0;
    function next() {
        if (i >= players.length) { callback(); return; }
        var p = players[i];
        var tg = 0, ta = 0, tp = 0, tpts = 0, w = 0, dr = 0, l = 0;
        matchesList.forEach(function(m) {
            var s = m.stats && m.stats[p.id];
            if (s) { tg += s.goals || 0; ta += s.assists || 0; }
            if (m.attendance && m.attendance[p.id]) tp++;
            var r = m.results && m.results[p.id];
            if (r === 'win') { w++; tpts += 3; }
            else if (r === 'draw') { dr++; tpts += 1; }
            else if (r === 'loss') { l++; }
        });
        db.collection('players').doc(p.id).update({
            totalGoals: tg, totalAssists: ta, totalPresence: tp,
            totalPoints: tpts, wins: w, draws: dr, losses: l
        }).then(function() { i++; next(); });
    }
    next();
}

function saveMatch() {
    if (!isAdmin) { alert('Apenas administradores podem salvar partidas!'); return; }
    if (!currentMatch.date) { alert('Por favor, informe a data da partida'); return; }
    var data = { date: currentMatch.date, stats: currentMatch.stats, attendance: currentMatch.attendance, results: currentMatch.results };
    var wasEditing = editingMatchId;
    var promise = editingMatchId
        ? db.collection('matches').doc(editingMatchId).update(data)
        : db.collection('matches').add(Object.assign({}, data, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
    promise.then(function() { return db.collection('matches').get(); })
    .then(function(snap) {
        var ml = snap.docs.map(function(d) { var o = d.data(); o.id = d.id; return o; });
        recalcTotals(ml, function() {
            currentMatch = { date: '', stats: {}, attendance: {}, results: {} };
            editingMatchId = null;
            activeTab = 'rankings';
            loadData();
            alert(wasEditing ? 'Partida atualizada!' : 'Partida salva!');
        });
    }).catch(function(e) { console.error(e); alert('Erro ao salvar partida!'); });
}

function editMatch(matchId) {
    if (!isAdmin) { alert('Apenas administradores podem editar partidas!'); return; }
    var m = null;
    for (var i = 0; i < matches.length; i++) { if (matches[i].id === matchId) { m = matches[i]; break; } }
    if (!m) return;
    currentMatch = {
        date: m.date,
        stats: m.stats ? JSON.parse(JSON.stringify(m.stats)) : {},
        attendance: m.attendance ? JSON.parse(JSON.stringify(m.attendance)) : {},
        results: m.results ? JSON.parse(JSON.stringify(m.results)) : {}
    };
    editingMatchId = matchId;
    activeTab = 'newMatch';
    render();
}

function deleteMatch(matchId) {
    if (!isAdmin) { alert('Apenas administradores podem deletar partidas!'); return; }
    if (confirm('Tem certeza que deseja deletar esta partida?')) {
        db.collection('matches').doc(matchId).delete()
        .then(function() { return db.collection('matches').get(); })
        .then(function(snap) {
            var ml = snap.docs.map(function(d) { var o = d.data(); o.id = d.id; return o; });
            recalcTotals(ml, function() { loadData(); alert('Partida deletada!'); });
        }).catch(function(e) { console.error(e); alert('Erro ao deletar partida!'); });
    }
}

function formatDate(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var LOGO_SVG = '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="64" height="64">' +
    '<circle cx="100" cy="100" r="98" fill="#1a1a1a"/>' +
    '<circle cx="100" cy="100" r="98" fill="none" stroke="#F5C518" stroke-width="5"/>' +
    '<circle cx="100" cy="100" r="72" fill="none" stroke="#F5C518" stroke-width="4"/>' +
    '<path d="M 28 122 A 72 72 0 0 0 172 122 Z" fill="#F5C518"/>' +
    '<defs>' +
    '<path id="tarc" d="M 18 92 A 83 83 0 0 1 182 92"/>' +
    '<path id="barc" d="M 20 136 A 83 83 0 0 0 180 136"/>' +
    '</defs>' +
    '<text fill="#F5C518" font-family="Arial Black,Arial" font-weight="900" font-size="29" letter-spacing="13">' +
    '<textPath href="#tarc" startOffset="50%" text-anchor="middle">SUB</textPath></text>' +
    '<text x="100" y="116" text-anchor="middle" fill="#F5C518" font-family="Arial Black,Arial" font-weight="900" font-size="72">50</text>' +
    '<text x="100" y="139" text-anchor="middle" fill="#1a1a1a" font-family="Arial Black,Arial" font-weight="900" font-size="19">2019</text>' +
    '<text fill="#F5C518" font-family="Arial Black,Arial" font-weight="900" font-size="19" letter-spacing="3">' +
    '<textPath href="#barc" startOffset="50%" text-anchor="middle">CINQUENTA</textPath></text>' +
    '</svg>';

function render() {
    var root = document.getElementById('root');
    if (loading) { root.innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="text-yellow-400 text-2xl">Carregando...</div></div>'; return; }

    var modal = '';
    if (showPasswordModal) {
        modal = '<div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">' +
            '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6 max-w-md w-full">' +
            '<h2 class="text-2xl font-bold text-yellow-400 mb-4">Acesso Administrativo</h2>' +
            '<input id="pw" type="password" placeholder="Senha" class="w-full px-4 py-2 bg-gray-800 border-2 border-yellow-400 text-white rounded-lg mb-4"/>' +
            '<div class="flex gap-2">' +
            '<button onclick="checkPassword()" class="flex-1 bg-yellow-400 text-black font-bold py-2 rounded-lg">Entrar</button>' +
            '<button onclick="closeAdminModal()" class="flex-1 bg-gray-700 text-white font-bold py-2 rounded-lg">Cancelar</button>' +
            '</div></div></div>';
    }

    var tabs = '<div class="flex gap-2 mb-6 overflow-x-auto pb-2">' +
        tb('rankings','Rankings') + tb('presence','Presenca') + tb('classification','Classificacao') +
        (isAdmin ? tb('newMatch', editingMatchId ? 'Editar Partida' : 'Nova Partida') : '') +
        (isAdmin ? tb('players','Jogadores') : '') +
        tb('history','Historico') + '</div>';

    var header = '<div class="bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-lg shadow-2xl p-4 mb-6">' +
        '<div class="flex items-center justify-between">' +
        '<div class="flex items-center gap-3">' + LOGO_SVG +
        '<div><h1 class="text-2xl md:text-4xl font-bold text-black">Sub 50 Cinquenta</h1>' +
        '<p class="text-black font-semibold text-sm">Gerenciador de Estatisticas</p></div></div>' +
        (isAdmin
            ? '<button onclick="logout()" class="bg-red-600 text-white font-bold py-2 px-4 rounded-lg">Sair</button>'
            : '<button onclick="openAdminModal()" class="bg-black text-yellow-400 font-bold py-2 px-4 rounded-lg">Admin</button>') +
        '</div></div>';

    root.innerHTML = modal + '<div class="max-w-6xl mx-auto">' + header + tabs + '<div id="tc"></div></div>';

    if (showPasswordModal) {
        var pw = document.getElementById('pw');
        pw.value = passwordInputValue;
        pw.addEventListener('input', function(e) { passwordInputValue = e.target.value; });
        pw.addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); });
        pw.focus();
    }
    renderTabContent();
}

function tb(tab, label) {
    return '<button onclick="setTab(\'' + tab + '\')" class="px-4 py-2 rounded-lg font-semibold whitespace-nowrap text-sm ' +
        (activeTab === tab ? 'bg-yellow-400 text-black' : 'bg-gray-800 text-yellow-400 hover:bg-gray-700') + '">' + label + '</button>';
}

function renderTabContent() {
    var tc = document.getElementById('tc');
    if (!tc) return;
    if (activeTab === 'rankings') tc.innerHTML = rankingsHTML();
    else if (activeTab === 'presence') tc.innerHTML = presenceHTML();
    else if (activeTab === 'classification') tc.innerHTML = classHTML();
    else if (activeTab === 'newMatch' && isAdmin) { tc.innerHTML = newMatchHTML(); bindMatch(); }
    else if (activeTab === 'players' && isAdmin) { tc.innerHTML = playersHTML(); bindPlayers(); }
    else if (activeTab === 'history') tc.innerHTML = historyHTML();
}

function rankRow(p, i, val) {
    return '<div class="flex items-center justify-between p-3 rounded-lg ' + (i===0?'bg-yellow-400':'bg-gray-800') + '">' +
        '<div class="flex items-center gap-3"><span class="font-bold text-lg ' + (i===0?'text-black':'text-yellow-400') + '">' + (i+1) + '</span>' +
        '<span class="font-semibold ' + (i===0?'text-black':'text-white') + '">' + esc(p.name) + '</span></div>' +
        '<span class="text-2xl font-bold ' + (i===0?'text-black':'text-yellow-400') + '">' + val + '</span></div>';
}

function rankingsHTML() {
    var bg = players.slice().sort(function(a,b){return b.totalGoals-a.totalGoals;});
    var ba = players.slice().sort(function(a,b){return b.totalAssists-a.totalAssists;});
    return '<div class="grid md:grid-cols-2 gap-6">' +
        '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><h2 class="text-2xl font-bold text-yellow-400 mb-4">Artilharia</h2>' +
        (bg.length ? '<div class="space-y-3">' + bg.map(function(p,i){return rankRow(p,i,p.totalGoals);}).join('') + '</div>' : '<p class="text-gray-400 text-center py-8">Nenhum gol ainda</p>') + '</div>' +
        '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><h2 class="text-2xl font-bold text-yellow-400 mb-4">Assistencias</h2>' +
        (ba.length ? '<div class="space-y-3">' + ba.map(function(p,i){return rankRow(p,i,p.totalAssists);}).join('') + '</div>' : '<p class="text-gray-400 text-center py-8">Nenhuma assistencia ainda</p>') + '</div></div>';
}

function presenceHTML() {
    var s = players.slice().sort(function(a,b){return b.totalPresence-a.totalPresence;});
    return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><h2 class="text-2xl font-bold text-yellow-400 mb-4">Ranking de Presenca</h2>' +
        (s.length ? '<div class="space-y-3">' + s.map(function(p,i){
            return '<div class="flex items-center justify-between p-3 rounded-lg ' + (i===0?'bg-yellow-400':'bg-gray-800') + '">' +
                '<div class="flex items-center gap-3"><span class="font-bold text-lg ' + (i===0?'text-black':'text-yellow-400') + '">' + (i+1) + '</span>' +
                '<span class="font-semibold ' + (i===0?'text-black':'text-white') + '">' + esc(p.name) + '</span></div>' +
                '<div class="text-right"><span class="text-2xl font-bold ' + (i===0?'text-black':'text-yellow-400') + '">' + p.totalPresence + '</span>' +
                '<div class="text-xs ' + (i===0?'text-black':'text-gray-400') + '">presencas</div></div></div>';
        }).join('') + '</div>' : '<p class="text-gray-400 text-center py-8">Nenhuma presenca ainda</p>') + '</div>';
}

function classHTML() {
    var s = players.slice().sort(function(a,b){
        if(b.totalPoints!==a.totalPoints)return b.totalPoints-a.totalPoints;
        if(b.wins!==a.wins)return b.wins-a.wins;
        return(b.totalGoals-b.totalAssists)-(a.totalGoals-a.totalAssists);
    });
    return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6 overflow-x-auto"><h2 class="text-2xl font-bold text-yellow-400 mb-4">Classificacao Individual</h2>' +
        (s.length ? '<table class="w-full text-left"><thead><tr class="border-b-2 border-yellow-400">' +
        '<th class="p-2 text-yellow-400">#</th><th class="p-2 text-yellow-400">Jogador</th>' +
        '<th class="p-2 text-yellow-400 text-center">V</th><th class="p-2 text-yellow-400 text-center">E</th>' +
        '<th class="p-2 text-yellow-400 text-center">D</th><th class="p-2 text-yellow-400 text-center">PTS</th></tr></thead><tbody>' +
        s.map(function(p,i){
            return '<tr class="border-b border-gray-700 ' + (i===0?'bg-yellow-400':'') + '">' +
                '<td class="p-2 font-bold ' + (i===0?'text-black':'text-yellow-400') + '">' + (i+1) + '</td>' +
                '<td class="p-2 font-semibold ' + (i===0?'text-black':'text-white') + '">' + esc(p.name) + '</td>' +
                '<td class="p-2 text-center ' + (i===0?'text-black':'text-gray-300') + '">' + (p.wins||0) + '</td>' +
                '<td class="p-2 text-center ' + (i===0?'text-black':'text-gray-300') + '">' + (p.draws||0) + '</td>' +
                '<td class="p-2 text-center ' + (i===0?'text-black':'text-gray-300') + '">' + (p.losses||0) + '</td>' +
                '<td class="p-2 text-center font-bold text-lg ' + (i===0?'text-black':'text-yellow-400') + '">' + (p.totalPoints||0) + '</td></tr>';
        }).join('') + '</tbody></table>'
        : '<p class="text-gray-400 text-center py-8">Nenhum resultado ainda</p>') + '</div>';
}

function newMatchHTML() {
    if (!players.length) return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><p class="text-gray-400 text-center py-8">Adicione jogadores primeiro</p></div>';
    var html = '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6">' +
        '<h2 class="text-2xl font-bold text-yellow-400 mb-6">' + (editingMatchId?'Editar Partida':'Nova Partida') + '</h2>';
    if (editingMatchId) html += '<div class="bg-yellow-400 text-black p-3 rounded-lg mb-4 flex items-center justify-between"><span class="font-semibold">Editando partida</span><button onclick="cancelEdit()" class="bg-black text-yellow-400 px-3 py-1 rounded">Cancelar</button></div>';
    html += '<div class="mb-6"><label class="block text-yellow-400 font-semibold mb-2">Data da Partida</label>' +
        '<input id="mdate" type="date" value="' + (currentMatch.date||'') + '" class="w-full px-4 py-2 bg-gray-800 border-2 border-yellow-400 text-white rounded-lg"/></div>' +
        '<div class="space-y-4 mb-6">' + players.map(function(p) {
            var st = currentMatch.stats[p.id] || { goals:0, assists:0 };
            var att = currentMatch.attendance[p.id] || false;
            var res = currentMatch.results[p.id];
            return '<div class="bg-gray-800 border border-yellow-400 p-4 rounded-lg">' +
                '<div class="flex items-center justify-between mb-3"><h3 class="font-semibold text-yellow-400">' + esc(p.name) + '</h3>' +
                '<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ' + (att?'checked':'') + ' onclick="toggleAttendance(\'' + p.id + '\')" class="w-5 h-5"/><span class="text-white">Presente</span></label></div>' +
                '<div class="grid grid-cols-2 gap-4 mb-3">' +
                '<div><label class="block text-sm text-gray-300 mb-1">Gols</label><input type="number" min="0" value="' + (st.goals||'') + '" placeholder="0" oninput="onStatInput(\'' + p.id + '\',\'goals\',this.value)" class="w-full px-3 py-2 bg-gray-900 border-2 border-yellow-400 text-white rounded-lg"/></div>' +
                '<div><label class="block text-sm text-gray-300 mb-1">Assistencias</label><input type="number" min="0" value="' + (st.assists||'') + '" placeholder="0" oninput="onStatInput(\'' + p.id + '\',\'assists\',this.value)" class="w-full px-3 py-2 bg-gray-900 border-2 border-yellow-400 text-white rounded-lg"/></div></div>' +
                '<div><label class="block text-sm text-gray-300 mb-2">Resultado</label><div class="flex gap-2">' +
                '<button onclick="setResult(\'' + p.id + '\',\'win\')" class="flex-1 py-2 rounded font-semibold ' + (res==='win'?'bg-green-600 text-white':'bg-gray-700 text-gray-300') + '">Vitoria</button>' +
                '<button onclick="setResult(\'' + p.id + '\',\'draw\')" class="flex-1 py-2 rounded font-semibold ' + (res==='draw'?'bg-yellow-600 text-white':'bg-gray-700 text-gray-300') + '">Empate</button>' +
                '<button onclick="setResult(\'' + p.id + '\',\'loss\')" class="flex-1 py-2 rounded font-semibold ' + (res==='loss'?'bg-red-600 text-white':'bg-gray-700 text-gray-300') + '">Derrota</button>' +
                '</div></div></div>';
        }).join('') + '</div>' +
        '<button onclick="saveMatch()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-lg">' + (editingMatchId?'Salvar Alteracoes':'Salvar Partida') + '</button></div>';
    return html;
}

function bindMatch() {
    var d = document.getElementById('mdate');
    if (d) d.addEventListener('change', function(e) { currentMatch.date = e.target.value; });
}

function playersHTML() {
    return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6">' +
        '<h2 class="text-2xl font-bold text-yellow-400 mb-6">Gerenciar Jogadores</h2>' +
        '<div class="flex gap-2 mb-6"><input id="npi" type="text" placeholder="Nome do jogador" value="' + esc(newPlayerNameValue) + '" class="flex-1 px-4 py-2 bg-gray-800 border-2 border-yellow-400 text-white placeholder-gray-400 rounded-lg"/>' +
        '<button onclick="addPlayer()" class="bg-yellow-400 text-black font-bold py-2 px-6 rounded-lg">Adicionar</button></div>' +
        '<div class="space-y-2">' + players.map(function(p) {
            return '<div class="flex items-center justify-between bg-gray-800 border border-yellow-400 p-4 rounded-lg">' +
                '<div><span class="font-semibold text-yellow-400">' + esc(p.name) + '</span>' +
                '<div class="text-sm text-gray-300 mt-1">' + p.totalGoals + ' gols - ' + p.totalAssists + ' assists - ' + p.totalPresence + ' presencas - ' + p.totalPoints + ' pts</div></div>' +
                '<button onclick="removePlayer(\'' + p.id + '\')" class="bg-red-600 text-white px-4 py-2 rounded-lg">Remover</button></div>';
        }).join('') +
        (players.length===0?'<p class="text-gray-400 text-center py-8">Nenhum jogador cadastrado</p>':'') + '</div></div>';
}

function bindPlayers() {
    var i = document.getElementById('npi');
    if (i) {
        i.addEventListener('input', function(e) { newPlayerNameValue = e.target.value; });
        i.addEventListener('keypress', function(e) { if (e.key==='Enter') addPlayer(); });
    }
}

function historyHTML() {
    if (!matches.length) return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><p class="text-gray-400 text-center py-8">Nenhuma partida registrada ainda</p></div>';
    return '<div class="bg-gray-900 border-2 border-yellow-400 rounded-lg p-6"><h2 class="text-2xl font-bold text-yellow-400 mb-6">Historico de Partidas</h2>' +
        '<div class="space-y-4">' + matches.slice().reverse().map(function(m) {
            var lines = players.map(function(p) {
                var s = m.stats && m.stats[p.id];
                var att = m.attendance && m.attendance[p.id];
                var res = m.results && m.results[p.id];
                if (!s && !att && !res) return '';
                var parts = ['<span class="font-medium text-white">' + esc(p.name) + ':</span>'];
                if (s && s.goals > 0) parts.push('<span>' + s.goals + ' gol(s)</span>');
                if (s && s.assists > 0) parts.push('<span>- ' + s.assists + ' assist.</span>');
                if (res==='win') parts.push('<span class="text-green-400">- Vitoria</span>');
                if (res==='draw') parts.push('<span class="text-yellow-400">- Empate</span>');
                if (res==='loss') parts.push('<span class="text-red-400">- Derrota</span>');
                if (att) parts.push('<span class="text-blue-400">- Presente</span>');
                return '<div class="text-sm text-gray-300 flex flex-wrap gap-1">' + parts.join(' ') + '</div>';
            }).join('');
            return '<div class="bg-gray-800 border border-yellow-400 p-4 rounded-lg">' +
                '<div class="flex justify-between items-center mb-3">' +
                '<span class="font-semibold text-yellow-400">' + formatDate(m.date) + '</span>' +
                (isAdmin ? '<div class="flex gap-2"><button onclick="editMatch(\'' + m.id + '\')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">Editar</button>' +
                '<button onclick="deleteMatch(\'' + m.id + '\')" class="bg-red-600 text-white px-3 py-1 rounded text-sm">Deletar</button></div>' : '') +
                '</div><div class="space-y-1">' + lines + '</div></div>';
        }).join('') + '</div></div>';
}

loadData();
</script>
</body>
</html>
